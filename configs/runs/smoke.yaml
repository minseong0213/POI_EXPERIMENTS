name: smoke
seed: 42
data:
  directory: data/poi_34k_seed42
  verify_hashes: true
model:
  name: random_forest
  params:
    n_estimators: 5
    max_depth: 5
    min_samples_leaf: 2
    class_weight: balanced
    n_jobs: 1
sampling:
  train_per_region: 20
  eval_per_region: 5
evaluation:
  splits: [validation]
  threshold: 0.5
