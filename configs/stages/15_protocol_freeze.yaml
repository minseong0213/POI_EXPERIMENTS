format: poi-locked-test-protocol-freeze-v1
manifest_output: artifacts/poi-remediation-20261001/protocol_freeze_manifest.json
required_stages: ['01', '06', '07', '08', '09', '10', '13', '14']

# These files affect freeze verification, locked-test gating, common metrics, model replay, or the
# resolved Python environment even when they are not owned by a single experiment stage.
protocol_dependencies:
  source_files:
    - src/poi/protocol_freeze.py
    - src/poi/data.py
    - src/poi/uncertainty.py
    - src/poi/clean_uncertainty.py
    - src/poi/final_test.py
    - src/poi/locked_test.py
    - src/poi/locked_test_backend.py
    - src/poi/defense_evaluate.py
    - src/poi/selected_explain.py
    - src/poi/attack_evaluate.py
    - src/poi/ablation.py
    - src/poi/benchmark.py
  config_files:
    - configs/stages/15_locked_test.yaml
  environment_files:
    - pyproject.toml
    - requirements.txt
    - requirements.lock

# This fresh review is separate from per-stage reviews. It must be written only after this
# freeze config and every shared source/config/environment dependency have their final bytes.
common_independent_review:
  verdict_file: artifacts/poi-remediation-20261001/reports/99_independent_review/protocol_common_freeze_verdict.json
  agent_role: independent_experiment_audit
  reviewer_role: independent_reviewer
  requested_model: gpt-6-astra
  reasoning_effort: medium
  fork_context: none
  gate_verdict_field: prospective_lock_readiness_verdict
  allowed_overall_verdicts: [PARTIAL]
  scope_tokens:
    - configs/stages/15_protocol_freeze.yaml
    - protocol_dependencies
  required_items:
    - common_dependency_byte_inventory
    - freeze_verifier_and_config_review
    - actual_runtime_environment_binding
  acknowledged_nonpass_items:
    historical_pristine_test_isolation: PARTIAL

