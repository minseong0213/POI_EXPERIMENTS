data_dir: data/poi_34k_seed42
output: artifacts/poi-robustness-next/reports/01_attack_generation
seed: 42
device: cuda
splits: [train, validation]
attack_batch_size: 1024
numeric_budgets_m: [10, 50, 100, 500, 1000]
categorical_budgets_l0: [1, 2, 3]
mixed_budgets:
  - {name: low, numeric_m: 100, categorical_l0: 1}
  - {name: medium, numeric_m: 500, categorical_l0: 2}
  - {name: high, numeric_m: 1000, categorical_l0: 3}
surrogate:
  holdout_fraction: 0.1
  batch_size: 512
  epochs: 100
  patience: 12
  learning_rate: 0.001
  weight_decay: 0.0001
attacks:
  fgsm: {steps: 1}
  pgd: {steps: 30}
  cw_l2: {steps: 60, kappa: 0.0, distance_weight: 0.05}
  capgd: {steps: 40}
  pcaa: {steps: 40, learning_rate: 0.15, entropy_weight: 0.01, candidate_draws: 8}
  moeva:
    generations: 24
    population: 32
    batch_size: 128
    mutation_scale: 0.15
    category_mutation: 0.25
